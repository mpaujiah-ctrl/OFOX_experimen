name: SHRP - Build cepheus

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'SHRP Minimal Manifest Branch'
        required: true
        default: 'shrp-12.1'
        type: choice
        options:
        - shrp-12.1
        - shrp-11       
      DEVICE_TREE:
        description: 'Device Tree'
        required: true
        default: 'https://github.com/tribual/twrp_cepheus'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch (verify on GitHub first!)'
        required: true
        default: 'twrp_12.1_erofs'
        type: choice
        options:
        - twrp_12.1_erofs
        - twrp_12.1_retrofit
        - twrp13        
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/xiaomi/cepheus'
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'cepheus'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
      
jobs:
  build:
    name: Build SHRP by ${{ github.actor }}
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Display Inputs
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }} @ ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "::endgroup::"

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Build Environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sudo apt-get update
        sudo apt-get install -y python2.7 python2.7-dev
        sudo ln -sf /usr/bin/python2.7 /usr/bin/python2
        sudo ln -sf /usr/bin/python2.7 /usr/bin/python

    - name: Set-up Manifest (TWRP minimal manifest)
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/TWRP
        cd ${GITHUB_WORKSPACE}/TWRP
        git config --global user.name "AS"
        git config --global user.email "WWW"
        repo init -u https://github.com/SHRP/manifest.git -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/TWRP
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
         
    - name: Inject FSCRYPT Fix
      run: |
        DEVICE_CONFIG=$(find ${GITHUB_WORKSPACE} -name "BoardConfig.mk" | grep "cepheus")
        echo "TW_USE_EXTERNAL_FSCRYPT := true" >> $DEVICE_CONFIG
        echo "TW_INCLUDE_CRYPTO := true" >> $DEVICE_CONFIG
        echo "TW_INCLUDE_CRYPTO_FBE := true" >> $DEVICE_CONFIG
        echo "Pemeriksaan lokasi file BoardConfig:"
        echo $DEVICE_CONFIG
        echo "Isi akhir BoardConfig.mk:"
        tail -n 10 $DEVICE_CONFIG
    
    - name: Patch fs_mgr Android.bp
      run: |
        sed -i 's/"libfscrypttwrp"/"libfscrypt"/g' ${GITHUB_WORKSPACE}/TWRP/system/core/fs_mgr/Android.bp || true
    
    - name: Inject Graphics Flags
      run: |
        DEVICE_CONFIG=$(find ${GITHUB_WORKSPACE} -name "BoardConfig.mk" | grep "cepheus")
        echo "TARGET_SCREEN_HEIGHT := 2340" >> $DEVICE_CONFIG
        echo "TARGET_SCREEN_WIDTH := 1080" >> $DEVICE_CONFIG
        echo "TW_THEME := portrait_hdpi" >> $DEVICE_CONFIG
        echo "RECOVERY_GRAPHICS_FORCE_USE_LINELENGTH := true" >> $DEVICE_CONFIG
    
    - name: Inject SHRP Important Flags
      run: |
        DEVICE_CONFIG=$(find ${GITHUB_WORKSPACE} -name "BoardConfig.mk" | grep "cepheus")
        echo "SHRP_INTERNAL := /sdcard" >> $DEVICE_CONFIG
        echo "SHRP_OTG := /usb_otg" >> $DEVICE_CONFIG
        echo "SHRP_FLASH := 1" >> $DEVICE_CONFIG
        echo "SHRP_EDL_MODE := 1" >> $DEVICE_CONFIG
    
    - name: Inject Fix FastbootD & Graphics
      run: |
        DEVICE_CONFIG=$(find ${GITHUB_WORKSPACE} -name "BoardConfig.mk" | grep "cepheus")
        echo "TW_HAS_MTP := true" >> $DEVICE_CONFIG
        echo "TW_INPUT_BLACK_LIST := \"hbtp_vm\"" >> $DEVICE_CONFIG
        echo "TW_USE_TOOLBOX := true" >> $DEVICE_CONFIG
        echo "TW_EXCLUDE_SUPERSU := true" >> $DEVICE_CONFIG
        echo "RECOVERY_GRAPHICS_FORCE_SINGLE_BUFFER := true" >> $DEVICE_CONFIG
    
    - name: Building SHRP
      run: |
        cd ${GITHUB_WORKSPACE}/TWRP
        export ALLOW_MISSING_DEPENDENCIES=true
        export TW_INCLUDE_CRYPTO=true
        export TW_USE_EXTERNAL_FSCRYPT=true
        set +e
        source build/envsetup.sh
        set -e
        lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng
        mka ${{ github.event.inputs.BUILD_TARGET }}image

    - name: Locate output
      id: out
      run: |
          OUT_DIR=${GITHUB_WORKSPACE}/TWRP/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
          echo "out_dir=$OUT_DIR" >> $GITHUB_OUTPUT
          ls -la "$OUT_DIR" | grep -iE 'twrp|recovery|\.img|\.zip' || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
          name: TWRP-cepheus-${{ github.run_number }}
          path: |
            ${{ steps.out.outputs.out_dir }}/recovery.img
            ${{ steps.out.outputs.out_dir }}/*.zip
          if-no-files-found: warn
          retention-days: 14
