name: SHRP -2- Build cepheus

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'SHRP Minimal Manifest Branch'
        required: true
        default: 'shrp-12.1'
        type: choice
        options:
        - shrp-12.1
        - shrp-11
      DEVICE_TREE:
        description: 'Device Tree'
        required: true
        default: 'https://github.com/tribual/twrp_cepheus'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'twrp_12.1_erofs'
        type: choice
        options:
        - twrp_12.1_erofs
        - twrp_12.1_retrofit
        - twrp13
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/xiaomi/cepheus'
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'cepheus'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'

jobs:
  build:
    name: Build SHRP_2 by ${{ github.actor }}
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean-up Environment
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Build Environment Setup
      run: |
        sudo apt update
        sudo apt -y upgrade
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sudo apt-get update
        sudo apt-get install -y python2.7 python2.7-dev
        sudo ln -sf /usr/bin/python2.7 /usr/bin/python2
        sudo ln -sf /usr/bin/python2.7 /usr/bin/python

    - name: Set-up SHRP Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/TWRP
        cd ${GITHUB_WORKSPACE}/TWRP
        git config --global user.name "AS"
        git config --global user.email "WWW"
        repo init -u https://github.com/SHRP/manifest.git -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/TWRP
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}

    - name: Inject Clean SHRP Flags Only
      run: |
        DEVICE_CONFIG=$(find ${GITHUB_WORKSPACE}/${{ github.event.inputs.DEVICE_PATH }} -name "BoardConfig.mk")
        echo "" >> $DEVICE_CONFIG
        echo "# SHRP Configurations" >> $DEVICE_CONFIG
        echo "SHRP_PATH := device/xiaomi/cepheus" >> $DEVICE_CONFIG
        echo "SHRP_MAINTAINER := User" >> $DEVICE_CONFIG
        echo "SHRP_DEVICE_CODE := cepheus" >> $DEVICE_CONFIG
        echo "SHRP_EDL_MODE := 1" >> $DEVICE_CONFIG
        echo "SHRP_EXTERNAL := /external_sd" >> $DEVICE_CONFIG
        echo "SHRP_INTERNAL := /sdcard" >> $DEVICE_CONFIG
        echo "SHRP_OTG := /usb_otg" >> $DEVICE_CONFIG

    - name: Building SHRP
      run: |
        cd ${GITHUB_WORKSPACE}/TWRP
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng
        make installclean
        mka ${{ github.event.inputs.BUILD_TARGET }}image

    - name: Locate Output
      id: out
      run: |
        OUT_DIR=${GITHUB_WORKSPACE}/TWRP/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        echo "out_dir=$OUT_DIR" >> $GITHUB_OUTPUT
        ls -la "$OUT_DIR" | grep -iE 'twrp|recovery|\.img|\.zip' || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SHRP-cepheus-${{ github.run_number }}
        path: |
          ${{ steps.out.outputs.out_dir }}/recovery.img
          ${{ steps.out.outputs.out_dir }}/*.zip
        if-no-files-found: warn
        retention-days: 14
